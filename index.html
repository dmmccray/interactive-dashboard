<body>
    <h1>My Interactive Dashboard"</h1>
    <p>This dashboard was created by Deirdre McCray for the WEB-115 course at Wake Tech". Be sure to indent your nested code for better readability!</p>

<script>
    document.write("This dashboard demonstrates how javaScript can be used to create interactive websites");
</script>

<!-- "The <noscript> is for web browsers withJavaScript rendering disabled."-->
<noscript>
    "Unfortunately, your web browser does not support JavaScript."
</noscript>


 <div class="container">
    <div class="row">
        <!-- Dashboard Content -->
        <div class="col"> id="metric-converter">
            <form>
                <input type="number" id="value" name="value" placeholder="Enter Value">
                <select id="conversiontype" name="conversiontype">
                    <option value="centimeterstoinches"> Centimeters to Inches</option>
                    <option value="centimeterstofeet"> Centimeters to Feet</option>
                    <option value="yardtometer"> Yard to Meter</option>
                    <option value="miletokilometer"> Mile to Kilometer</option>  
                    
                    <option value="inchestocentimeters"> Inches to Centimeters</option>
                    <option value="feettocentimeterstofeet"> Feet to Centimeters</option>
                    <option value="metertoyard"> Meter to Yard</option>
                    <option value="kilometertomile"> Kilometer to Mile</option>
                </select>
                <button type="button" id="convertbutton>Convert</button>
            </form>
        </div>
    </div>
</div>



</body>
</html>
